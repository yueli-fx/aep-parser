name: ci

on:
  push:
    branches: [main, mainline, "mainline/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l aep.go aep_test.go aep_benchmark_test.go cmd/aep internal/rifx internal/server internal/toolkitcli)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Check capability index
        run: go run ./cmd/capindex -check
      - name: Build cross-platform core
        run: go run ./cmd/aepverify cross-platform
      - name: Fuzz parser smoke
        run: go test ./internal/rifx -run '^$' -fuzz '^FuzzParseNeverPanics$' -fuzztime=10s
      - name: Fuzz serializer smoke
        run: go test ./internal/aep_test -run '^$' -fuzz '^FuzzFromReaderNeverPanics$' -fuzztime=10s
      - name: Race-test safety modules
        run: go test -race ./internal/rifx ./internal/serializer ./internal/scene ./internal/aep_test ./internal/server ./internal/toolkitcli
