name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ""
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            suffix: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            suffix: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build unified CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o aep-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} ./cmd/aep
      - uses: actions/upload-artifact@v4
        with:
          name: aep-${{ matrix.goos }}-${{ matrix.goarch }}
          path: aep-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
